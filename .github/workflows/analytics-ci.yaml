name: Analytics Service CI

on:
  push:
    branches:
      - main
    paths:
      - "analytics-service/**"
      - ".github/workflows/analytics-ci.yml"

  pull_request:
    branches:
      - main
    paths:
      - "analytics-service/**"
      - ".github/workflows/analytics-ci.yml"

permissions:
  contents: write
  id-token: write

env:
  PYTHON_VERSION: "3.13"
  SERVICE_DIR: "analytics-service"
  ECR_REPOSITORY: "analytics-service"
  AWS_REGION: "us-east-1"


# BUILD E TESTES

jobs:

  build-test:
    name: Build & Unit Test
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: analytics-service/requirements.txt

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          pip install -r analytics-service/requirements.txt

      - name: Install test dependencies
        run: |
          pip install pytest

      - name: Check Python syntax
        run: |
          python -m compileall -q analytics-service

      - name: Run unit tests
        shell: bash
        run: |
          if find analytics-service \
            -type f \( -name "test_*.py" -o -name "*_test.py" \) \
            | grep -q .; then

            echo "Testes encontrados. Executando pytest..."
            pytest analytics-service -v

          else
            echo "Nenhum teste unitario encontrado."
            echo "Validacao de sintaxe concluida com sucesso."
          fi



  # LINT


  lint:
    name: Python Lint
    runs-on: ubuntu-latest
    needs: build-test

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff
        run: |
          ruff check analytics-service



  # SECURITY - SAST / SCA


  security-scan:
    name: SAST & SCA
    runs-on: ubuntu-latest
    needs: lint

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7


      # SAST - Bandit

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Bandit
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Run Bandit SAST
        run: |
          bandit \
            -r analytics-service \
            -lll


      # SCA - Trivy

      - name: Trivy filesystem vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "analytics-service"
          format: "table"
          severity: "CRITICAL"
          exit-code: "1"
          ignore-unfixed: true

  # DOCKER BUILD + CONTAINER SCAN + ECR + GITOPS

  docker-build:
    name: Docker Build & Container Scan
    runs-on: ubuntu-latest
    needs: security-scan

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      # IMAGE TAG

      - name: Generate image tag
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

          echo "Docker image tag:"
          echo "${GITHUB_SHA::7}"

      # DOCKER BUILD

      - name: Build Docker image
        run: |
          docker build \
            -f analytics-service/Dockerfile \
            -t analytics-service:${IMAGE_TAG} \
            .

      # TRIVY CONTAINER SCAN

      - name: Trivy container image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "analytics-service:${{ env.IMAGE_TAG }}"
          format: "table"
          severity: "CRITICAL"
          exit-code: "1"
          ignore-unfixed: true


      # AWS
      #
      # Só executa quando:
      #
      # DEPLOY_TO_AWS=true


      - name: Configure AWS credentials
        if: >
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          vars.DEPLOY_TO_AWS == 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::050451396335:role/GitHubActionsECRRole
          aws-region: ${{ env.AWS_REGION }}

      # LOGIN ECR

      - name: Login to Amazon ECR
        if: >
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          vars.DEPLOY_TO_AWS == 'true'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # TAG IMAGE

      - name: Tag Docker image for ECR
        if: >
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          vars.DEPLOY_TO_AWS == 'true'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker tag \
            analytics-service:${IMAGE_TAG} \
            $ECR_REGISTRY/$ECR_REPOSITORY:${IMAGE_TAG}

   # PUSH ECR

      - name: Push Docker image to ECR
        if: >
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          vars.DEPLOY_TO_AWS == 'true'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker push \
            $ECR_REGISTRY/$ECR_REPOSITORY:${IMAGE_TAG}


      # GITOPS

      - name: Update GitOps image tag
        if: >
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          vars.DEPLOY_TO_AWS == 'true'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          sed -i \
            "s|image: .*analytics-service.*|image: $ECR_REGISTRY/$ECR_REPOSITORY:${IMAGE_TAG}|" \
            .github/GitOps/analytics-service/deployment.yaml

          echo "Nova imagem configurada:"
          grep "image:" \
            .github/GitOps/analytics-service/deployment.yaml

          echo "Alteracao realizada:"
          git diff


      
      # COMMIT GITOPS
      

      - name: Commit GitOps update
        if: >
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          vars.DEPLOY_TO_AWS == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            .github/GitOps/analytics-service/deployment.yaml

          if git diff --cached --quiet; then
            echo "Nenhuma alteracao no deployment.yaml"
            exit 0
          fi

          git commit \
            -m "gitops: update analytics-service to ${IMAGE_TAG}"

          git push