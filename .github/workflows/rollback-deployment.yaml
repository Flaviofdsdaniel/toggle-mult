name: Rollback GitOps por rollout travado

on:
  repository_dispatch:
    types:
      - rollback-deployment

permissions:
  contents: write

concurrency:
  group: rollback-${{ github.event.client_payload.service || 'unknown' }}
  cancel-in-progress: false

jobs:
  rollback:
    name: Reverter para a imagem estável anterior
    runs-on: ubuntu-latest
    steps:
      - name: Checkout completo do histórico GitOps
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validar alerta e preparar rollback
        id: rollback
        env:
          SERVICE: ${{ github.event.client_payload.service }}
          NAMESPACE: ${{ github.event.client_payload.namespace }}
          ALERT_NAME: ${{ github.event.client_payload.alertname }}
          EXPECTED_IMAGE: ${{ github.event.client_payload.expected_image }}
        run: |
          test "$NAMESPACE" = "toggle-mult"
          test "$ALERT_NAME" = "RollbackVersaoDeDeploy"
          python .github/scripts/rollback_gitops.py \
            --service "$SERVICE" \
            --expected-image "$EXPECTED_IMAGE"

      - name: Commit e publicar o rollback GitOps
        if: steps.rollback.outputs.changed == 'true'
        env:
          MANIFEST: ${{ steps.rollback.outputs.manifest }}
          SERVICE: ${{ github.event.client_payload.service }}
          PREVIOUS_IMAGE: ${{ steps.rollback.outputs.previous_image }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$MANIFEST"
          git commit -m "gitops: rollback automático de $SERVICE para $PREVIOUS_IMAGE"
          git push origin HEAD:main

      - name: Registrar alerta obsoleto sem alterar GitOps
        if: steps.rollback.outputs.changed == 'false'
        run: echo "O GitOps já avançou desde o alerta; nenhuma reversão foi publicada."
