name: Auth Service CI

on: 
  push:
    branches:
      - main
    paths:
      - "auth-service/**"
      - ".github/workflows/auth-ci.yaml"
      - ".github/GitOps/auth-service/**"

  pull_request:
    branches:
      - main
    paths:
      - "auth-service/**"
      - ".github/workflows/auth-ci.yaml"
      - ".github/GitOps/auth-service/**"

permissions:
  contents: write
  id-token: write
  
jobs:
  build-test:
    name: Build & Unit Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: auth-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Download dependencies
        run: go mod download

      - name: Prepare dependencies
        run: go mod tidy

      - name: Build application
        run: go build ./...

  lint:
    name: Linter / Static Analysis
    runs-on: ubuntu-latest
    needs: build-test

    defaults:
      run:
        working-directory: auth-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25"

      - name: Prepare dependencies
        run: go mod tidy

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: auth-service

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint

    defaults:
      run:
        working-directory: auth-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Prepare dependencies
        run: go mod tidy

      # SCA
      - name: Trivy SCA Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: auth-service
          severity: CRITICAL
          exit-code: 1
          ignore-unfixed: true

      # SAST
      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0

      - name: Run gosec
        run: gosec -severity high ./...

  docker-build:
    name: Docker Build & Container Scan
    runs-on: ubuntu-latest
    needs: security-scan

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate image tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Build Docker image
        run: |
          docker build \
            -f auth-service/Dockerfile \
            -t auth-service:${IMAGE_TAG} \
            .

      - name: Trivy Container Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: auth-service:${{ env.IMAGE_TAG }}
          format: table
          severity: CRITICAL
          exit-code: 1
          ignore-unfixed: true

      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::050451396335:role/GitHubActionsECRRole
          aws-region: us-east-1

      - name: Login to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag Docker image for ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: auth-service
        run: |
          docker tag \
            auth-service:${IMAGE_TAG} \
            $ECR_REGISTRY/$ECR_REPOSITORY:${IMAGE_TAG}

      - name: Push Docker image to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: auth-service
        run: |
          docker push \
          $ECR_REGISTRY/$ECR_REPOSITORY:${IMAGE_TAG}

      - name: Update GitOps image tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: auth-service
        run: |
          sed -i "s|image: .*auth-service.*|image: $ECR_REGISTRY/$ECR_REPOSITORY:${IMAGE_TAG}|" \
            .github/GitOps/auth-service/deployment.yaml

          echo "Nova imagem configurada:"
          grep "image:" .github/GitOps/auth-service/deployment.yaml

          echo "Alteracao realizada:"
          git diff

      - name: Commit GitOps update
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .github/GitOps/auth-service/deployment.yaml
          
          if git diff --cached --quiet; then
            echo "Nenhuma alteracao no deployment.yaml"
            exit 0
          fi

          git commit -m "gitops: update auth-service to ${IMAGE_TAG}"
          git push