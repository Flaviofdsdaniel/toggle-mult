name: Auth Service CI

on: 
  push:
    branches:
      - main
  
  pull_request:
    branches:
      - main
  
jobs:
  build-test:
    name: Build & Unit Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Download dependencies
        run: go mod download

      - name: Build application
        run: go build ./...
