apiVersion: apps/v1
kind: Deployment

metadata:
  name: flag-service
  namespace: toggle-mult
  
spec:
  replicas: 1 
  selector:
    matchLabels:
      app: flag-service
  template:
    metadata:
      labels:
        app: flag-service
    spec:
      containers:
      - name: flag-service
        image: 050451396335.dkr.ecr.us-east-1.amazonaws.com/togglemaster/flag-service
        ports:
        - containerPort: 8002

        envFrom:
          - configMapRef:
              name: flag-configmap
          - secretRef:
              name: flag-secret

        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"

        readinessProbe:
          httpGet:
            path: /health
            port: 8002
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3
          successThreshold: 1

        livenessProbe:
          httpGet:
            path: /health
            port: 8002
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3