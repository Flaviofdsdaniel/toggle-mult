apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: togglemaster-service-alerts
  namespace: observability
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: togglemaster.workloads
      rules:
        - alert: ToggleMultDeploymentUnavailable
          expr: kube_deployment_status_replicas_unavailable{namespace="toggle-mult"} > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Deployment com réplicas indisponíveis
            description: 'O Deployment {{ $labels.deployment }} no namespace {{ $labels.namespace }} está com réplicas indisponíveis há mais de 5 minutos.'