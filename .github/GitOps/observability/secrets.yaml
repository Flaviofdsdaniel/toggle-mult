apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secretsmanager
  namespace: observability
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: observability-credentials
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: SecretStore
  target:
    name: observability-credentials
    creationPolicy: Owner
  data:
    - secretKey: NEW_RELIC_LICENSE_KEY
      remoteRef:
        key: toggle-mult/observability
        property: NEW_RELIC_LICENSE_KEY
    - secretKey: JIRA_PROMETHEUS_API_KEY
      remoteRef:
        key: toggle-mult/observability
        property: JIRA_PROMETHEUS_API_KEY
    - secretKey: DISCORD_WEBHOOK_URL
      remoteRef:
        key: toggle-mult/observability
        property: DISCORD_WEBHOOK_URL
