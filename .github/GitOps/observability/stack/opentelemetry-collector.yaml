apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-opentelemetry
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
    chart: opentelemetry-collector
    targetRevision: 0.178.3
    helm:
      releaseName: opentelemetry-collector
      values: |
        mode: deployment
        replicaCount: 1

        image:
          repository: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector

        command:
          name: otelcol

        extraEnvs:
          - name: NEW_RELIC_LICENSE_KEY
            valueFrom:
              secretKeyRef:
                name: observability-credentials
                key: NEW_RELIC_LICENSE_KEY

        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 300m
            memory: 384Mi

        ports:
          prometheus:
            enabled: true
            containerPort: 8889
            servicePort: 8889
            protocol: TCP

        serviceMonitor:
          enabled: true
          metricsEndpoints:
            - port: prometheus
          extraLabels:
            release: kube-prometheus-stack

        config:
          receivers:
            otlp:
              protocols:
                grpc:
                  endpoint: ${env:MY_POD_IP}:4317
                http:
                  endpoint: ${env:MY_POD_IP}:4318

          processors:
            memory_limiter:
              check_interval: 5s
              limit_percentage: 80
              spike_limit_percentage: 25
            batch: {}

          exporters:
            otlphttp/newrelic:
              endpoint: https://otlp.nr-data.net
              headers:
                api-key: ${env:NEW_RELIC_LICENSE_KEY}

            otlphttp/loki:
              endpoint: http://loki-gateway.observability.svc.cluster.local/otlp

            prometheus:
              endpoint: ${env:MY_POD_IP}:8889
              resource_constant_labels:
                included:
                  - service.name

          service:
            extensions:
              - health_check

            pipelines:
              traces:
                receivers:
                  - otlp
                processors:
                  - memory_limiter
                  - batch
                exporters:
                  - otlphttp/newrelic

              metrics:
                receivers:
                  - otlp
                processors:
                  - memory_limiter
                  - batch
                exporters:
                  - prometheus

              logs:
                receivers:
                  - otlp
                processors:
                  - memory_limiter
                  - batch
                exporters:
                  - otlphttp/loki

  destination:
    server: https://kubernetes.default.svc
    namespace: observability

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true