apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-service
  namespace: toggle-mult
  
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analytics-service

  template:
    metadata:
      labels:
        app: analytics-service

    spec:
      containers:
        - name: analytics-service
          image: 050451396335.dkr.ecr.us-east-1.amazonaws.com/togglemaster/analytics-service
          ports:
            - containerPort: 8005
          envFrom:
            - configMapRef:
                name: analytics-configmap
          
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          readinessProbe:
            httpGet:
              path: /health
              port: 8005
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
            successThreshold: 1

          livenessProbe:
            httpGet:
              path: /health
              port: 8005
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3