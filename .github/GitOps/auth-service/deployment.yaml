apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: toggle-mult

spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: 050451396335.dkr.ecr.us-east-1.amazonaws.com/auth-service:755df2a
          ports:
            - containerPort: 8001
          envFrom:
            - configMapRef:
                name: auth-configmap
            - secretRef:
                name: auth-secret

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
                